<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Calistoga&amp;family=Alfa+Slab+One&amp;display=swap');
      .brand-title {
        font-family: 'Calistoga', 'Alfa Slab One', 'Arial Black', Impact, serif;
        font-weight: 900;
        fill: #BE1823;
      }
    </style>
  </defs>

  <!-- Clean White Badge Container from Official Brandbook Page 2 -->
  <rect x="0" y="0" width="740" height="280" rx="24" fill="#FFFFFF" />

  <g transform="translate(30, 30)">
    <!-- Red Box Emblem -->
    <rect x="0" y="0" width="220" height="220" fill="#BE1823" />

    <!-- 1. Top White Pizza Crust Arc -->
    <path
      d="M 0 98 
         C 14 44, 76 8, 180 0 
         L 180 16 
         C 90 24, 34 58, 0 126 
         Z"
      fill="#FFFFFF"
    />

    <!-- 2. Main White Pizza Cheese Wedge with Bite Notch -->
    <path
      d="M 0 150
         C 42 86, 112 52, 220 66
         L 220 152
         L 174 190
         L 118 168
         A 22 22 0 0 1 78 158
         L 0 150
         Z"
      fill="#FFFFFF"
    />

    <!-- 3. Red Pepperoni Toppings -->
    <circle cx="140" cy="98" r="18" fill="#BE1823" />
    <circle cx="94" cy="128" r="16" fill="#BE1823" />
    <circle cx="165" cy="158" r="15" fill="#BE1823" />
    <circle cx="220" cy="104" r="18" fill="#BE1823" />

    <!-- Right: Typography "TASTY PIZZA" in Original Red -->
    <g transform="translate(254, 0)">
      <text x="0" y="96" class="brand-title" font-size="96" letter-spacing="0.04em">TASTY</text>
      <text x="0" y="206" class="brand-title" font-size="96" letter-spacing="0.08em">PIZZA</text>
    </g>
  </g>
</svg>
